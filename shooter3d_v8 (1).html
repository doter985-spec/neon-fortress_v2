<!--
РАЗРАБОТЧИКУ: система сохранения прогресса (собственная, двойная).
1) Каждое сохранение мгновенно пишется в localStorage (ключ neon_fortress_save_v1) - работает без авторизации и без SDK.
2) Тот же объект S (рекорд, убийства, достижения, настройки, покупки, снимок забега между волнами) отправляется в облако Яндекс Игр
   через player.setData (с троттлингом 3 с и принудительной отправкой при сворачивании/закрытии вкладки).
3) При старте берётся более свежая копия по метке времени S.ts. Снимок забега (S.run) делается при входе в магазин между волнами,
   поэтому после обновления страницы кнопка "Продолжить" возвращает игрока на то же место. Ориентация экрана состояние не сбрасывает.
4) Покупки: монеты (consumable) начисляются в S.bank и сразу сохраняются, затем вызывается consumePurchase; токены выданных покупок
   хранятся в S.tok (защита от повторной выдачи). no_ads - постоянная покупка, проверяется через payments.getPurchases().
Для Яндекс Игр создайте в Консоли товары с ID: coins_500, coins_2500, no_ads.
-->

function openPause(){if(state!='play')return;state='pause';down=false;keys={};P.tCrouch=false;exitLock();gp(false);pauseUI()}
function onDeath(){state='dead';exitLock();gp(false);down=false;G.gm=G.wave*2;S.gems+=G.gm;if(G.wave>S.best)S.best=G.wave;S.run=null;persist(true);deadUI();showAd()}
function deadUI(){state='dead';setMenu(`<h1>Конец игры</h1><p class="sub">Дошли до волны ${G.wave}. Монет накоплено: ${G.coins}.${G.wave>=S.best&&G.wave>0?' Новый рекорд!':''}</p><div class="row"><div>Лучший результат</div><b>${S.best}</b></div><div class="row"><div>Получено кристаллов: </div><b style="color:var(--gold)">${G.gm||0}</b></div><button class="go" onclick="newGame()">Играть снова</button><button class="go alt" onclick="lobby()">В лобби</button>`)}
function hint(){return TV?'Стрелки — движение, OK (Enter) — рывок. Прицел, стрельба и способности работают автоматически. Back — пауза, двойное нажатие — выход.':TOUCH?'Левый стик — движение, перетаскивание по экрану — обзор. Кнопки: огонь, прыжок, приседание, перезарядка и способности. Раскладку можно менять в настройках.':'WASD — движение, пробел — прыжок, C — присесть (на бегу — скольжение), мышь — обзор и огонь, R — перезарядка, 1–4 — оружие, Shift — рывок, Q — огненный шар, E — ядовитое болото. Esc — пауза. Клавиши можно менять в настройках.'}
// ---- магазин ----
const PERKS=[['dmg','Закалённые патроны','+5% урона за уровень',5,10],['hp','Бронежилет','+10 здоровья за уровень',5,10],['coin','Стартовый капитал','+25 монет в начале забега за уровень',5,8],['smg','Пистолет-пулемёт с первой волны','Оружие доступно в начале каждого забега',1,30]];
const perkCost=p=>p[4]*(S.perk[p[0]]+1);
function buyPerk(id){const p=PERKS.find(x=>x[0]==id);if(S.perk[id]>=p[3]||S.gems<perkCost(p))return;S.gems-=perkCost(p);S.perk[id]++;sfx('buy');persist(true);storeUI(backFn,'perk')}
async function storeUI(fn,tab){backFn=fn||lobby;stab=tab||stab||'perk';const my=++stok,back='<button class="go alt" onclick="backFn()">Назад</button>',
tabs='<div class="tabs">'+[['perk','Улучшения'],['offers','Предложения']].map(([k,l])=>`<button class="${stab==k?'on':'alt'}" onclick="storeUI(backFn,'${k}')">${l}</button>`).join('')+'</div>';
if(stab=='perk'){setMenu('<h1>Магазин</h1>'+tabs+`<div class="row"><div>Кристаллы: </div><b style="color:var(--gold)">${S.gems}</b></div>`+PERKS.map(p=>{const lv=S.perk[p[0]],mx=lv>=p[3];return `<div class="row"><div>${p[1]}<small>${p[2]} · уровень ${lv}/${p[3]}</small></div><button ${mx||S.gems<perkCost(p)?'disabled':''} onclick="buyPerk('${p[0]}')">${mx?'Макс.':perkCost(p)+' ◆'}</button></div>`}).join('')+back);return}
setMenu('<h1>Магазин</h1>'+tabs+`<div class="row"><div>Банк монет: </div><b style="color:var(--gold)">${S.bank}</b></div><p class="sub">Загрузка каталога…</p>`+back);
let items=[];if(payments){try{items=await payments.getCatalog()}catch(e){}}if(my!=stok||stab!='offers')return;
const rows=!payments?'<p class="sub">Платные предложения доступны в Яндекс Играх.</p>':items.length?items.map(p=>{const own=p.id=='no_ads'&&S.noAds,img=(p.getPriceCurrencyImage?p.getPriceCurrencyImage('small'):'');
return `<div class="row"><div style="display:flex;gap:10px;align-items:center"><img class="pi" src="${esc(p.imageURI||'')}" alt=""><div>${esc(p.title)}<small>${esc(p.description||'')}</small></div></div>${own?'<b>Куплено</b>':`<button title="${esc(p.price||'')}" onclick="iap('${esc(p.id)}')">${esc(p.priceValue)} ${img?`<img src="${esc(img)}" alt="${esc(p.priceCurrencyCode)}">`:esc(p.priceCurrencyCode)}</button>`}</div>`}).join(''):'<p class="sub">Каталог недоступен</p>';
setMenu('<h1>Магазин</h1>'+tabs+`<div class="row"><div>Банк монет: </div><b style="color:var(--gold)">${S.bank}</b></div>`+rows+back)}
async function iap(id){if(!authed){authOffer(backFn);return}try{const pu=await payments.purchase({id});await grantPurchase(pu);toast(tr('Покупка выполнена'))}catch(e){toast(tr('Покупка не удалась'))}storeUI(backFn,'offers')}
function disposeE(e){scene.remove(e.m);e.m.traverse(o=>{if(o.geometry)o.geometry.dispose()});e.mats.forEach(m=>m.dispose());e.fg.material.dispose()}
// ---- крауч / скольжение ----
function crouchMul(dt){const cw=!!(keys.KeyC||P.tCrouch);
if(cw&&!P.cwp&&P.gr&&P.slide<=0&&Math.hypot(P.vx,P.vz)>5){const sp=Math.hypot(P.vx,P.vz);P.sd={x:P.vx/sp,z:P.vz/sp};P.dd=P.sd;P.dh=new Set();P.slide=.8;sfx('slide')}
P.cwp=cw;P.crouch=cw;if(P.slide>0&&!P.gr)P.slide=0;return P.crouch&&P.slide<=0?.5:1}
function slideStep(dt){P.slide-=dt;const k=Math.max(0,P.slide/.8);P.vx=P.sd.x*(4+14*k*k);P.vz=P.sd.z*(4+14*k*k);dashHit(.35);if(Math.random()<dt*20)spark(new THREE.Vector3(P.x,.1,P.z),0xb9c2d0,1)}
// ---- эффекты ----
function hitMark(kill){hmEl.className=kill?'k':'';hmEl.style.transition='none';hmEl.style.opacity=1;requestAnimationFrame(()=>{hmEl.style.transition='opacity .25s';hmEl.style.opacity=0})}
function dnum(p,d,head){if(!S.gfx.part)return;if(dnums.length>14){dnums.shift().el.remove()}const el=document.createElement('div');el.className='dn';el.textContent=Math.round(d);if(head){el.style.color='#ffd166';el.style.fontSize='19px'}document.body.appendChild(el);dnums.push({el,v:p.clone(),t:0})}
function fx(t,dt){if(!P)return;const lo=state=='play'&&P.hp<maxHp()*.3?.28+.12*Math.sin(t/160):0,o=Math.max(lo,P.dv>.01?P.dv:0);if(P.dv>.01)P.dv*=.93;dvEl.style.opacity=o;
if(!dust){const n=160,g=new THREE.BufferGeometry(),a=new Float32Array(n*3);for(let i=0;i<n*3;i+=3){a[i]=rnd(-30,30);a[i+1]=rnd(0,10);a[i+2]=rnd(-30,30)}g.setAttribute('position',new THREE.BufferAttribute(a,3));dust=new THREE.Points(g,new THREE.PointsMaterial({color:0x88ccff,size:2,sizeAttenuation:false,transparent:true,opacity:.45,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));dust.frustumCulled=false;dust.userData.a=a;scene.add(dust)}
dust.visible=S.gfx.part>.3;if(dust.visible){const a=dust.userData.a;for(let i=0;i<a.length;i+=3){a[i]+=Math.sin(t/1500+i)*.3*dt;a[i+1]+=.25*dt;a[i+2]+=Math.cos(t/1700+i)*.3*dt;if(a[i+1]>10)a[i+1]=.2}dust.geometry.attributes.position.needsUpdate=true;dust.position.set(cam.position.x,0,cam.position.z)}
for(let i=dnums.length-1;i>=0;i--){const d=dnums[i];d.t+=dt;d.v.y+=1.2*dt;const q=d.v.clone().project(cam);if(d.t>.8||q.z>1){d.el.remove();dnums.splice(i,1);continue}d.el.style.transform=`translate(${(q.x*.5+.5)*innerWidth}px,${(-q.y*.5+.5)*innerHeight}px)`;d.el.style.opacity=1-d.t/.8}
fpsN++;fpsT+=dt;if(fpsT>=.5){if(S.gfx.fps)fpsEl.textContent=Math.round(fpsN/fpsT)+' FPS';fpsN=0;fpsT=0}}
// ---- адаптивная музыка ----
const MINOR=[0,3,5,7,10],ROOTS=[45,43,46,48],mtof=n=>440*Math.pow(2,(n-69)/12);
function mood(){if(state=='play'){if(en.some(e=>e.t==3&&e.hp>0))return'boss';if(P.hp<maxHp()*.3)return'tense';return'wave'}return state=='shop'?'shop':state=='dead'?'dead':'menu'}
function mnote(f,t,d,ty,v,cut){const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type=ty;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut||2000;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.03,d/4));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(g);g.connect(MU);o.start(t);o.stop(t+d+.05)}
function mkick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(MU);o.start(t);o.stop(t+.2)}
function mhat(t,v){const q=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();q.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);q.connect(f);f.connect(g);g.connect(MU);q.start(t,Math.random()*.5,.06)}
function mstep(st,t,md,bpm){const sd=60/bpm/4,s=st&15,bar=st>>4,wv=G?G.wave:0,root=ROOTS[(wv>>2)%4]+[0,0,-4,-2][bar%4];
const pad=(v,len)=>[0,3,7,10].forEach((iv,i)=>mnote(mtof(root+12+iv),t,sd*len,i%2?'triangle':'sine',v,900));
if(md=='menu'){if(s==0)pad(.05,16);if(s%8==4)mnote(mtof(root+24+MINOR[(st>>3)%5]),t,sd*6,'sine',.05,3000)}
else if(md=='shop'){if(s==0)pad(.045,16);if(s%4==0)mnote(mtof(root+12+MINOR[(st>>2)%5]),t,sd*3,'triangle',.06,2500)}
else if(md=='dead'){if(s==0&&bar%2==0)mnote(mtof(root-12),t,sd*30,'sine',.15,300)}
else{const boss=md=='boss',tense=md=='tense';if(s==0)pad(boss?.06:.045,16);
if(s%2==0){const iv=[0,0,12,0,0,7,0,10][(s>>1)&7];mnote(mtof(root-12+(boss?iv:0)),t,sd*1.8,'sawtooth',boss?.13:.1,tense?260:500)}
if(tense){if(s==0||s==3)mkick(t,.3)}else if(s%4==0)mkick(t,boss?.4:.3);
if(boss||(!tense&&s%2==1))mhat(t,boss?.05:.035);
if(!tense&&s%2==0&&Math.random()<(wv>=5?.7:.45))mnote(mtof(root+24+MINOR[(Math.random()*5)|0]),t,sd*1.5,'square',.035,1800)}}
function musicTick(){if(!AC||AC.state!='running')return;if(!S.snd||S.mus<=0){mNext=AC.currentTime+.1;return}
const md=mood(),wv=G?G.wave:0,bpm=({menu:76,shop:88,dead:60,boss:138})[md]||Math.min(150,100+wv*2.5);while(mNext<AC.currentTime+.25){mstep(mStep++,mNext,md,bpm);mNext+=60/bpm/4}}
function startMusic(){if(mTimer||!AC)return;noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;mNext=AC.currentTime+.1;mTimer=setInterval(musicTick,100)}
boot();requestAnimationFrame(loop);
</script></body></html>
